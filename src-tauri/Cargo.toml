[package]
name = "oscar-desktop"
version = "0.3.0"
edition = "2021"

[lib]
name = "oscar_core"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "form"] }
futures-util = "0.3"
regex = "1"
chrono = "0.4"
dotenvy = "0.15"
tiktoken-rs = "0.12"
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
crc32fast = "1"
hmac = "0.12"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
pdf-extract = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
calamine = "0.31"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }



[profile.release]
lto = "thin"
codegen-units = 1
strip = true
